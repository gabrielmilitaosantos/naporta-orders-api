services:
  postgres:
    image: postgres:16-alpine
    container_name: naporta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naporta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: naporta-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker Network, the db host is the name and the service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/naporta?schema=public
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data: